<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="/css/components/floating-buttons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ - Duong Kha Coffee</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/contact.css">
</head>
<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-content">
            <div class="logo-loader-wrapper">
                <img src="images/logo.png" alt="Duong Kha Coffee" class="loader-logo">
                <div class="loader-gold-ring"></div>
            </div>
            <p class="loader-text">Đang tải...</p>
        </div>
    </div>

    <div id="app-header"></div>

    <main class="contact-page-container">
        <!-- MAP TRỰC QUAN - BẢN FIX KHÔNG LỖI PB -->
        <div class="contact-map-wrapper">
            <iframe 
                src="https://maps.google.com/maps?q=10.377503,105.4432275+(X%C6%B0%E1%BB%9Fng%20Rang%20D%C6%B0%C6%A1ng%20Kha)&z=16&hl=vi&output=embed"
                width="100%" 
                height="100%" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
            <div class="map-pin-info">
                <span class="pin-dot"></span>
                <div>
                    <b>Xưởng Rang Dương Kha</b><br>
                    287 Hùng Vương, Long Xuyên, An Giang<br>
                    <a href="https://www.google.com/maps/place/C%C6%A1+S%E1%BB%9F+C%C3%A0+Ph%C3%AA+Rang+D%C6%B0%C6%A1ng+Kha/@10.377503,105.4432275" target="_blank">Mở Google Maps →</a>
                </div>
            </div>
        </div>

        <!-- FORM NỔI - GIỮ NGUYÊN -->
        <div class="contact-card-floating">
            <div class="card-header">
                <span class="gold-leaf-divider">❖</span>
                <h2 class="title-elegant">Gửi Thư Cho Dương Kha</h2>
                <p class="subtitle">Chúng tôi luôn sẵn sàng lắng nghe bạn</p>
            </div>
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="fullname">HỌ VÀ TÊN*</label>
                    <input type="text" id="fullname" placeholder="Nhập họ và tên..." required>
                </div>
                <div class="form-group">
                    <label for="email">EMAIL*</label>
                    <input type="email" id="email" placeholder="example@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">SỐ ĐIỆN THOẠI</label>
                    <input type="tel" id="phone" placeholder="Nhập số điện thoại...">
                </div>
                <div class="form-group">
                    <label for="message">LỜI NHẮN*</label>
                    <textarea id="message" rows="4" placeholder="Viết lời nhắn của bạn tại đây..." required></textarea>
                </div>
                <button type="submit" id="submitBtn" class="btn-gold-outline">GỬI LỜI NHẮN</button>
                <div id="statusMessage" class="status-message"></div>
            </form>
        </div>
    </main>

    <div id="app-footer"></div>

    <script src="js/components.js"></script>
    <script src="js/contact.js"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('page-loader');
        setTimeout(() => loader.classList.add('fade-out'), 800);
      });
    </script>
    <script src="/js/components/floating-buttons.js"></script>
</body>
</html>
