<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gu Của Bạn - Dương Kha Coffee</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/pages/gu-quiz.css">
    <link rel="stylesheet" href="/css/components/floating-buttons.css">
    <link rel="stylesheet" href="/css/components/brand.css">
</head>
<body>
    <div class="page-loader" id="page-loader">
        <div class="loader-content">
            <div class="logo-loader-wrapper">
                <img src="images/logo.png" alt="Duong Kha Coffee" class="loader-logo">
                <div class="loader-gold-ring"></div>
            </div>
            <p class="loader-text">Đang tìm gu...</p>
        </div>
    </div>

    <div id="app-header"></div>
    <div id="site-brand"></div>

    <main class="page-wrapper">
        <div class="container">
            <div id="gu-quiz-root">
                <!-- JS render -->
            </div>
        </div>
    </main>

    <div id="app-footer"></div>

    <script src="js/components.js"></script>
    <script src="/js/components/site-brand.js"></script>
    <script src="js/gu-quiz.js"></script>
    <script src="/js/components/floating-buttons.js"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('page-loader');
        setTimeout(() => loader.classList.add('fade-out'), 600);
      });
    </script>
</body>
</html>
